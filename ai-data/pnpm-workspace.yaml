# 应用与共享包都通过 Workspace 管理依赖。
packages:
  - apps/*
  - packages/*

# 按检查结果允许打包工具、数据库驱动及 Vue 适配依赖运行安装脚本。
allowBuilds:
  esbuild: true
  oracledb: true
  "vue-demi@0.14.10": true

# 仅集中维护多个工作区包共用的依赖版本；单包专用依赖在所属 package.json 声明。
catalog:
  "@types/node": ^26.2.0
  eslint: ^10.9.0
  prettier: ^3.9.6
  typescript: 7.0.2
  tsx: ^4.23.12
  esbuild: ^0.28.2
  vitest: ^4.1.11
  zod: 4.4.3
  mssql: ^12.7.0
  dayjs: ^1.11.23
  axios: ^1.19.0
  pino: ^10.3.1
  fastify: ^5.12.1
  jose: ^6.2.10

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.104.0"
  - "@tanstack/vue-query@5.104.0"
