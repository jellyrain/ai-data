<!doctype html>
<html lang="zh-CN" data-palette="olive" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>AI Data · 数据分析工作台</title>
    <script>
      (() => {
        let preference = { mode: "light", palette: "olive" };
        try {
          const saved = JSON.parse(localStorage.getItem("ai-data.appearance.v1"));
          if (
            saved &&
            Object.keys(saved).length === 2 &&
            ["light", "dark", "system"].includes(saved.mode) &&
            ["olive", "blue", "teal", "violet"].includes(saved.palette)
          )
            preference = saved;
        } catch {
          /* 存储不可用时使用默认外观。 */
        }
        const root = document.documentElement;
        const dark =
          preference.mode === "dark" ||
          (preference.mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        root.dataset.mode = preference.mode;
        root.dataset.palette = preference.palette;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      html {
        background: #ffffff;
      }
      html.dark {
        background: #191b18;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
